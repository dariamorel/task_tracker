apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: task-tracker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
- apiGroups: [""]
  resources: ["namespaces", "nodes", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
- kind: ServiceAccount
  name: vector
  namespace: task-tracker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: task-tracker
data:
  vector.yaml: |
    data_dir: /vector-data

    sources:
      k8s:
        type: kubernetes_logs
        self_node_name: ${VECTOR_SELF_NODE_NAME}
        extra_label_selector: app=tracker-app

    transforms:
      parse_json:
        type: remap
        inputs: [k8s]
        source: |
          parsed, err = parse_json(.message)
          if err != null {
            abort
          }
          . = parsed

    sinks:
      vlogs:
        type: elasticsearch
        inputs: [parse_json]
        endpoints:
          - http://victoria-logs.task-tracker.svc:9428/insert/elasticsearch/
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: service.name,k8s.pod.name
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: task-tracker
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      tolerations:
      - operator: Exists
      containers:
      - name: vector
        image: timberio/vector:0.39.0-alpine
        command: ["vector", "--config", "/etc/vector/vector.yaml"]
        env:
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: config
          mountPath: /etc/vector
          readOnly: true
        - name: var-log
          mountPath: /var/log
          readOnly: true
        - name: data
          mountPath: /vector-data
      volumes:
      - name: config
        configMap:
          name: vector-config
      - name: var-log
        hostPath:
          path: /var/log
      - name: data
        emptyDir: {}
