apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: task-tracker
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: tracker-app
  namespace: task-tracker
spec:
  type: NodePort
  selector:
    app: tracker-app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
