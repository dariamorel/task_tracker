apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
  namespace: task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober
  template:
    metadata:
      labels:
        app: prober
    spec:
      containers:
      - name: prober
        image: curlimages/curl:8.11.1
        command: ["sh", "-c"]
        args:
        - |
          while true; do
            curl -sS -o /dev/null -w "GET %{http_code}\n" http://tracker-app:8080/api/v1/tasks
            sleep 15
          done
