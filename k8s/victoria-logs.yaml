apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-pvc
  namespace: task-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
      - name: victoria-logs
        image: victoriametrics/victoria-logs:v1.52.0
        args:
        - -storageDataPath=/storage
        - -httpListenAddr=:9428
        ports:
        - containerPort: 9428
        volumeMounts:
        - name: storage
          mountPath: /storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: victoria-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: task-tracker
spec:
  selector:
    app: victoria-logs
  ports:
  - port: 9428
    targetPort: 9428
